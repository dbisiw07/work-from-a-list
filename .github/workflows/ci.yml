# Builds every push and pull request and runs the checks. A tag like v1.0 also
# publishes a release with Work-from-a-List.zip, the file get.sh installs.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: VERSION="${GITHUB_REF_NAME#v}" ./release.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Work-from-a-List.zip --generate-notes
